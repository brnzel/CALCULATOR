<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CALC</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:#0a0c10; --panel:#111318; --border:#1e2330;
  --accent:#00e5ff; --accent2:#ff4081; --accent3:#69ff47;
  --purple:#c792ea; --text:#e0e8f0; --muted:#4a5568;
  --display-bg:#060810; --btn-bg:#161b26; --btn-hover:#1e2535; --btn-active:#252d42;
}
[data-theme="sakura"]{--bg:#1a0a12;--panel:#211018;--border:#3d1f2e;--accent:#ff7eb3;--accent2:#ff4081;--accent3:#ffb3d1;--text:#ffe0ec;--muted:#7a4060;--display-bg:#130810;--btn-bg:#2a1020;--btn-hover:#381528;--btn-active:#451a32;}
[data-theme="forest"]{--bg:#080f0a;--panel:#0f1a10;--border:#1a2e1c;--accent:#4ade80;--accent2:#fb923c;--accent3:#a3e635;--text:#d4f0d8;--muted:#3a5c3e;--display-bg:#050d06;--btn-bg:#111e13;--btn-hover:#172618;--btn-active:#1e301f;}
[data-theme="amber"]{--bg:#0f0900;--panel:#1a1000;--border:#2e1f00;--accent:#f59e0b;--accent2:#ef4444;--accent3:#fde68a;--text:#fef3c7;--muted:#5c3d00;--display-bg:#0a0600;--btn-bg:#1f1400;--btn-hover:#2a1c00;--btn-active:#362400;}
[data-theme="slate"]{--bg:#f0f2f5;--panel:#ffffff;--border:#d1d9e0;--accent:#3b82f6;--accent2:#ef4444;--accent3:#10b981;--text:#1e293b;--muted:#94a3b8;--display-bg:#e8ecf0;--btn-bg:#f8fafc;--btn-hover:#edf2f7;--btn-active:#e2e8f0;}

*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--bg); min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  font-family:'Rajdhani',sans-serif; color:var(--text); padding:16px;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 20% 20%,rgba(0,229,255,.04) 0%,transparent 50%),
             radial-gradient(ellipse at 80% 80%,rgba(255,64,129,.04) 0%,transparent 50%);
}

.calc-wrapper{
  width:min(500px,96vw);
  background:var(--panel); border:1px solid var(--border);
  border-radius:16px; box-shadow:0 0 60px rgba(0,0,0,.6),0 0 20px rgba(0,229,255,.05);
  overflow:hidden; position:relative;
}
.calc-wrapper::before{
  content:''; position:absolute; top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--accent),transparent); opacity:.5;
}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);}
.tab{
  flex:1; padding:12px 8px; background:transparent; border:none;
  font-family:'Rajdhani',sans-serif; font-size:11px; font-weight:700;
  letter-spacing:2.5px; color:var(--muted); cursor:pointer;
  transition:all .15s; border-right:1px solid var(--border); position:relative;
}
.tab:last-child{border-right:none;}
.tab.active{color:var(--accent);}
.tab.active::after{
  content:''; position:absolute; bottom:0; left:15%; right:15%; height:2px;
  background:var(--accent); border-radius:2px 2px 0 0;
}
.tab:hover:not(.active){color:var(--text);}

/* DISPLAY */
.display{
  background:var(--display-bg); padding:20px 22px 14px;
  border-bottom:1px solid var(--border); min-height:130px;
  display:flex; flex-direction:column; justify-content:flex-end;
}
.expr-line{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--muted);text-align:right;min-height:18px;margin-bottom:4px;word-break:break-all;opacity:.75;letter-spacing:.5px;}
.result-line{font-family:'Share Tech Mono',monospace;font-size:36px;color:var(--text);text-align:right;line-height:1.1;transition:color .15s;word-break:break-all;}
.result-line.computed{color:var(--accent);text-shadow:0 0 20px rgba(0,229,255,.25);}
.result-line.error{color:var(--accent2)!important;font-size:18px!important;}
.scaled-line{font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--accent3);text-align:right;min-height:16px;margin-top:4px;opacity:.9;letter-spacing:.5px;}

/* SUFFIX + THEME BAR */
.suffix-bar{
  display:flex; gap:6px; padding:10px 14px;
  border-bottom:1px solid var(--border); background:#0d1018;
  align-items:center; position:relative;
}
.suffix-label{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:700;flex-shrink:0;}
.suf-btn{
  padding:4px 12px; border-radius:5px; border:1px solid var(--border);
  background:transparent; font-family:'Share Tech Mono',monospace;
  font-size:13px; color:var(--muted); cursor:pointer; transition:all .12s; font-weight:700;
}
.suf-btn.k{color:#ffc947;border-color:rgba(255,201,71,.3);background:rgba(255,201,71,.05);}
.suf-btn.m{color:#ff7043;border-color:rgba(255,112,67,.3);background:rgba(255,112,67,.05);}
.suf-btn.b{color:var(--purple);border-color:rgba(199,146,234,.3);background:rgba(199,146,234,.04);}
.suf-btn.t{color:var(--accent);border-color:rgba(0,229,255,.3);background:rgba(0,229,255,.05);}
.suf-btn:hover{opacity:.8;}
.whole-btn{
  margin-left:auto; background:transparent; border:1px solid var(--border);
  border-radius:6px; padding:3px 9px; font-family:'Share Tech Mono',monospace;
  font-size:11px; font-weight:700; color:var(--muted); cursor:pointer; transition:all .15s;
}
.whole-btn:hover{color:var(--text);}
.whole-btn.on{background:rgba(105,255,71,.12);border-color:var(--accent3);color:var(--accent3);}
.theme-corner{position:relative;flex-shrink:0;}
.theme-icon-btn{
  background:transparent; border:1px solid var(--border); border-radius:6px;
  padding:3px 8px; font-size:14px; cursor:pointer; transition:background .12s; line-height:1;
}
.theme-icon-btn:hover{background:rgba(255,255,255,.07);}
.theme-dropdown{
  display:none; position:absolute; right:0; top:calc(100% + 6px);
  background:var(--panel); border:1px solid var(--border);
  border-radius:10px; overflow:hidden; z-index:99;
  min-width:130px; box-shadow:0 8px 24px rgba(0,0,0,.5);
}
.theme-dropdown.open{display:block;}
.theme-dropdown .swatch{
  display:flex; align-items:center; gap:9px; padding:8px 14px; cursor:pointer;
  font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:700;
  letter-spacing:1px; color:var(--muted); transition:all .1s;
}
.theme-dropdown .swatch:hover{background:rgba(255,255,255,.05);color:var(--text);}
.theme-dropdown .swatch.active{color:var(--accent);background:rgba(255,255,255,.03);}
.sw-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;display:inline-block;}

/* MODE BAR */
.mode-bar{display:flex;border-bottom:1px solid var(--border);}
.mode-btn{
  flex:1; padding:7px; background:transparent; border:none;
  font-family:'Rajdhani',sans-serif; font-size:10px; font-weight:700;
  letter-spacing:1.5px; color:var(--muted); cursor:pointer;
  border-right:1px solid var(--border); transition:all .15s;
}
.mode-btn:last-child{border-right:none;}
.mode-btn.active{color:var(--accent3);background:rgba(105,255,71,.04);}
.mode-btn:hover:not(.active){color:var(--text);}

/* BUTTONS */
.buttons{padding:14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.btn{
  padding:17px 8px; border-radius:9px; border:1px solid var(--border);
  background:var(--btn-bg); color:var(--text); font-family:'Rajdhani',sans-serif;
  font-size:16px; font-weight:600; cursor:pointer; transition:all .1s;
  position:relative; overflow:hidden; letter-spacing:.5px; user-select:none;
}
.btn:hover{background:var(--btn-hover);border-color:#2a3248;}
.btn:active{background:var(--btn-active);transform:scale(.96);}
.btn.op{color:var(--accent);border-color:rgba(0,229,255,.2);background:rgba(0,229,255,.05);}
.btn.op:hover{background:rgba(0,229,255,.1);border-color:rgba(0,229,255,.35);}
.btn.fn{color:#b0b8d0;font-size:13px;}
.btn.adv{color:var(--purple);font-size:12px;border-color:rgba(199,146,234,.2);background:rgba(199,146,234,.04);}
.btn.adv:hover{background:rgba(199,146,234,.1);}
.btn.clear{color:var(--accent2);border-color:rgba(255,64,129,.25);background:rgba(255,64,129,.05);}
.btn.clear:hover{background:rgba(255,64,129,.12);}
.btn.eq{background:var(--accent);color:#000;border-color:var(--accent);font-size:20px;font-weight:700;}
.btn.eq:hover{background:#33eaff;}
.btn.eq:active{background:#00c4dd;}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.12);transform:scale(0);animation:ripple .35s linear;pointer-events:none;}
@keyframes ripple{to{transform:scale(4);opacity:0;}}

/* HISTORY */
.history-toggle{
  display:flex; align-items:center; justify-content:space-between;
  padding:8px 16px; border-top:1px solid var(--border);
  cursor:pointer; font-size:10px; letter-spacing:2px;
  color:var(--muted); font-weight:700; background:#0d1018; user-select:none;
}
.history-toggle:hover{color:var(--text);}
.hist-count{background:rgba(0,229,255,.15);color:var(--accent);border-radius:10px;padding:1px 7px;font-size:10px;}
.history-panel{max-height:0;overflow:hidden;transition:max-height .28s ease;background:var(--display-bg);}
.history-panel.open{max-height:200px;border-top:1px solid var(--border);overflow-y:auto;}
.history-panel::-webkit-scrollbar{width:3px;}
.history-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.hist-empty{text-align:center;padding:20px;font-size:11px;color:var(--muted);letter-spacing:1px;font-weight:600;}
.hist-item{
  display:flex; justify-content:space-between; align-items:center;
  padding:9px 16px; border-bottom:1px solid #12161f;
  cursor:pointer; transition:background .1s; gap:12px;
}
.hist-item:last-child{border-bottom:none;}
.hist-item:hover{background:rgba(255,255,255,.03);}
.hist-expr{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--muted);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hist-result{font-family:'Share Tech Mono',monospace;font-size:13px;color:var(--accent);white-space:nowrap;}
.hist-clear{
  display:block; width:100%; padding:7px; background:transparent; border:none;
  border-top:1px solid var(--border); font-family:'Rajdhani',sans-serif;
  font-size:10px; letter-spacing:2px; color:var(--accent2);
  cursor:pointer; font-weight:700; transition:background .12s;
}
.hist-clear:hover{background:rgba(255,64,129,.06);}

/* AI PANEL */
.ai-panel{padding:14px;display:flex;flex-direction:column;gap:10px;height:100%;}
.ai-hint{
  font-size:11px;color:var(--muted);letter-spacing:.5px;line-height:1.6;
  background:rgba(0,229,255,.04);border:1px solid rgba(0,229,255,.1);
  border-radius:8px;padding:10px 12px;flex-shrink:0;
}
.ai-hint strong{color:var(--accent);font-family:'Share Tech Mono',monospace;}
.chat-area{
  flex:1; background:var(--display-bg); border:1px solid var(--border);
  border-radius:10px; padding:12px; overflow-y:auto;
  display:flex; flex-direction:column; gap:10px; min-height:320px;
}
.chat-area::-webkit-scrollbar{width:3px;}
.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg{display:flex;flex-direction:column;gap:3px;max-width:92%;}
.msg.user{align-self:flex-end;align-items:flex-end;}
.msg.ai{align-self:flex-start;align-items:flex-start;}
.msg-label{font-size:9px;letter-spacing:1.5px;color:var(--muted);font-weight:700;padding:0 4px;font-family:'Rajdhani',sans-serif;}
.msg-bubble{
  font-family:'Share Tech Mono',monospace;font-size:12px;
  padding:8px 12px;border-radius:10px;line-height:1.6;
  word-break:break-word;white-space:pre-wrap;overflow-wrap:anywhere;
}
.msg.user .msg-bubble{background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.25);color:var(--accent);border-radius:10px 10px 2px 10px;}
.msg.ai  .msg-bubble{background:rgba(105,255,71,.06);border:1px solid rgba(105,255,71,.15);color:var(--text);border-radius:10px 10px 10px 2px;}
.msg.ai  .msg-bubble.err{background:rgba(255,64,129,.06);border-color:rgba(255,64,129,.2);color:var(--accent2);}
.typing-dot{display:inline-block;width:6px;height:6px;background:var(--accent3);border-radius:50%;animation:blink 1s infinite;margin:0 2px;}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.ai-input-row{display:flex;gap:8px;flex-shrink:0;}
.ai-input{
  flex:1;background:var(--display-bg);border:1px solid var(--border);
  border-radius:8px;padding:10px 14px;font-family:'Share Tech Mono',monospace;
  font-size:13px;color:var(--text);outline:none;transition:border-color .15s;
}
.ai-input::placeholder{color:var(--muted);}
.ai-input:focus{border-color:rgba(0,229,255,.4);}
.ai-send{
  padding:10px 20px;background:var(--accent);color:#000;border:none;
  border-radius:8px;font-family:'Rajdhani',sans-serif;font-size:13px;
  font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .12s;flex-shrink:0;
}
.ai-send:hover{background:#33eaff;}
.ai-send:disabled{opacity:.4;cursor:not-allowed;}
.empty-state{display:flex;align-items:center;justify-content:center;height:100%;opacity:.3;font-size:11px;letter-spacing:2px;font-weight:700;}
</style>
</head>
<body>
<div class="calc-wrapper" id="wrapper">

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" id="t-calc" onclick="switchTab('calc')">CALCULATOR</button>
    <button class="tab" id="t-ai" onclick="switchTab('ai')">&#10022; AI MATH</button>
  </div>

  <!-- ===== CALC TAB ===== -->
  <div id="tab-calc">
    <div class="display">
      <div class="expr-line" id="expr"></div>
      <div class="result-line" id="result">0</div>
      <div class="scaled-line" id="scaled"></div>
    </div>

    <div class="suffix-bar">
      <span class="suffix-label">SCALE</span>
      <button class="suf-btn k" onclick="appendSuffix('k')">k</button>
      <button class="suf-btn m" onclick="appendSuffix('M')">M</button>
      <button class="suf-btn b" onclick="appendSuffix('B')">B</button>
      <button class="suf-btn t" onclick="appendSuffix('T')">T</button>
      <button class="whole-btn" id="whole-btn" onclick="toggleWholeMode()">#.0</button>
      <div class="theme-corner">
        <button class="theme-icon-btn" onclick="toggleThemeDropdown(event)">&#127912;</button>
        <div class="theme-dropdown" id="theme-dropdown">
          <div class="swatch active" data-t="cyber"  onclick="setTheme('cyber')"> <span class="sw-dot" style="background:conic-gradient(#00e5ff,#ff4081,#69ff47)"></span>Cyber</div>
          <div class="swatch"        data-t="sakura" onclick="setTheme('sakura')"><span class="sw-dot" style="background:conic-gradient(#ff7eb3,#ffb3d1,#ff4081)"></span>Sakura</div>
          <div class="swatch"        data-t="forest" onclick="setTheme('forest')"><span class="sw-dot" style="background:conic-gradient(#4ade80,#a3e635,#fb923c)"></span>Forest</div>
          <div class="swatch"        data-t="amber"  onclick="setTheme('amber')"> <span class="sw-dot" style="background:conic-gradient(#f59e0b,#fde68a,#ef4444)"></span>Amber</div>
          <div class="swatch"        data-t="slate"  onclick="setTheme('slate')"> <span class="sw-dot" style="background:conic-gradient(#3b82f6,#e2e8f0,#10b981)"></span>Slate</div>
        </div>
      </div>
    </div>

    <div class="mode-bar">
      <button class="mode-btn active" id="mb-basic" onclick="setMode('basic')">BASIC</button>
      <button class="mode-btn" id="mb-adv" onclick="setMode('adv')">ADVANCED</button>
    </div>

    <div class="buttons" id="btns-basic">
      <button class="btn clear" onclick="action('ac')">AC</button>
      <button class="btn fn"    onclick="action('backspace')">&#9003;</button>
      <button class="btn fn"    onclick="action('pct')">%</button>
      <button class="btn op"    onclick="action('op','/')">&#247;</button>
      <button class="btn" onclick="action('num','7')">7</button>
      <button class="btn" onclick="action('num','8')">8</button>
      <button class="btn" onclick="action('num','9')">9</button>
      <button class="btn op" onclick="action('op','*')">&#215;</button>
      <button class="btn" onclick="action('num','4')">4</button>
      <button class="btn" onclick="action('num','5')">5</button>
      <button class="btn" onclick="action('num','6')">6</button>
      <button class="btn op" onclick="action('op','-')">&#8722;</button>
      <button class="btn" onclick="action('num','1')">1</button>
      <button class="btn" onclick="action('num','2')">2</button>
      <button class="btn" onclick="action('num','3')">3</button>
      <button class="btn op" onclick="action('op','+')">+</button>
      <button class="btn fn"  onclick="action('sign')">+/&#8722;</button>
      <button class="btn" onclick="action('num','0')">0</button>
      <button class="btn fn" onclick="action('dot')">.</button>
      <button class="btn eq" onclick="action('eq')">=</button>
    </div>

    <div class="buttons" id="btns-adv" style="display:none">
      <button class="btn clear" onclick="action('ac')">AC</button>
      <button class="btn fn"    onclick="action('backspace')">&#9003;</button>
      <button class="btn fn"    onclick="action('paren','(')">( </button>
      <button class="btn fn"    onclick="action('paren',')')"> )</button>
      <button class="btn adv" onclick="action('fn','Math.sqrt(')">&#8730;x</button>
      <button class="btn adv" onclick="action('pow','**2')">x&#178;</button>
      <button class="btn adv" onclick="action('pow','**3')">x&#179;</button>
      <button class="btn adv" onclick="action('pow','**')">x&#696;</button>
      <button class="btn adv" onclick="action('fn','Math.log(')">ln</button>
      <button class="btn adv" onclick="action('fn','Math.log10(')">log</button>
      <button class="btn adv" onclick="action('fn','Math.sin(')">sin</button>
      <button class="btn adv" onclick="action('fn','Math.cos(')">cos</button>
      <button class="btn adv" onclick="action('fn','Math.tan(')">tan</button>
      <button class="btn adv" onclick="action('const','Math.PI')">&#960;</button>
      <button class="btn adv" onclick="action('fn','Math.exp(')">e&#696;</button>
      <button class="btn adv" onclick="action('fn','Math.abs(')">|x|</button>
      <button class="btn" onclick="action('num','7')">7</button>
      <button class="btn" onclick="action('num','8')">8</button>
      <button class="btn" onclick="action('num','9')">9</button>
      <button class="btn op" onclick="action('op','/')">&#247;</button>
      <button class="btn" onclick="action('num','4')">4</button>
      <button class="btn" onclick="action('num','5')">5</button>
      <button class="btn" onclick="action('num','6')">6</button>
      <button class="btn op" onclick="action('op','*')">&#215;</button>
      <button class="btn" onclick="action('num','1')">1</button>
      <button class="btn" onclick="action('num','2')">2</button>
      <button class="btn" onclick="action('num','3')">3</button>
      <button class="btn op" onclick="action('op','-')">&#8722;</button>
      <button class="btn" onclick="action('num','0')">0</button>
      <button class="btn fn" onclick="action('dot')">.</button>
      <button class="btn op" onclick="action('op','+')">+</button>
      <button class="btn eq" onclick="action('eq')">=</button>
    </div>

    <div class="history-toggle" id="hist-toggle" onclick="toggleHistory()">
      <span id="hist-label">&#9656; HISTORY</span>
      <span class="hist-count" id="hist-count" style="display:none"></span>
    </div>
    <div class="history-panel" id="history-panel">
      <div class="hist-empty">NO HISTORY YET</div>
    </div>
  </div>

  <!-- ===== AI TAB ===== -->
  <div id="tab-ai" style="display:none">
    <div class="ai-panel">
      <div class="ai-hint">
        Type any math or question &mdash; plain english or symbols.<br>
        <strong>79M / 20k</strong> &nbsp;&middot;&nbsp; <strong>sqrt(144)</strong> &nbsp;&middot;&nbsp; <strong>if anshika is 14 now, how old was she 2 years ago</strong>
      </div>
      <div class="chat-area" id="chat-area">
        <div class="empty-state" id="empty-state">TYPE A CALCULATION BELOW</div>
      </div>
      <div class="ai-input-row">
        <input class="ai-input" id="ai-input" placeholder="e.g. 40M / 20k or five hundred / 3" autocomplete="off"
          onkeydown="if(event.key==='Enter'){event.preventDefault();sendAI();}" />
        <button class="ai-send" id="ai-send-btn" onclick="sendAI()">GO</button>
      </div>
    </div>
  </div>

</div><!-- end .calc-wrapper -->

<script>
// ============================================================
// STATE
// ============================================================
let expr = '', lastResult = null, hasResult = false, parenCount = 0;
let calcHistory = [];
let wholeMode = localStorage.getItem('wholeMode') === 'true';

const resultEl = document.getElementById('result');
const exprEl   = document.getElementById('expr');
const scaledEl = document.getElementById('scaled');

// ============================================================
// TABS
// ============================================================
function switchTab(t) {
  document.getElementById('tab-calc').style.display = t === 'calc' ? 'block' : 'none';
  document.getElementById('tab-ai').style.display   = t === 'ai'   ? 'block' : 'none';
  document.getElementById('t-calc').classList.toggle('active', t === 'calc');
  document.getElementById('t-ai').classList.toggle('active',   t === 'ai');
  if (t === 'ai') setTimeout(function(){ document.getElementById('ai-input').focus(); }, 50);
}

// ============================================================
// THEME
// ============================================================
function setTheme(t) {
  document.getElementById('wrapper').setAttribute('data-theme', t);
  document.querySelectorAll('.theme-dropdown .swatch').forEach(function(s){ s.classList.toggle('active', s.dataset.t === t); });
  document.getElementById('theme-dropdown').classList.remove('open');
  localStorage.setItem('calcTheme', t);
}
function toggleThemeDropdown(e) {
  e.stopPropagation();
  document.getElementById('theme-dropdown').classList.toggle('open');
}
document.addEventListener('click', function(){ document.getElementById('theme-dropdown').classList.remove('open'); });
(function(){ var t = localStorage.getItem('calcTheme'); if(t) setTheme(t); })();

// ============================================================
// MODE
// ============================================================
function setMode(m) {
  document.getElementById('mb-basic').classList.toggle('active', m === 'basic');
  document.getElementById('mb-adv').classList.toggle('active',   m === 'adv');
  document.getElementById('btns-basic').style.display = m === 'basic' ? 'grid' : 'none';
  document.getElementById('btns-adv').style.display   = m === 'adv'   ? 'grid' : 'none';
}

// ============================================================
// WHOLE MODE
// ============================================================
function applyWholeMode() {
  var btn = document.getElementById('whole-btn');
  btn.classList.toggle('on', wholeMode);
}
function toggleWholeMode() {
  wholeMode = !wholeMode;
  localStorage.setItem('wholeMode', wholeMode);
  applyWholeMode();
  if (lastResult !== null) { resultEl.textContent = fmtNum(lastResult); showScaled(lastResult); }
}
applyWholeMode();

// ============================================================
// SUFFIX EXPANSION
// ============================================================
function expandSuffixes(e) {
  return e
    .replace(/(\d+(?:\.\d+)?)\s*Th/gi, function(_,n){ return '('+n+'*1000)'; })
    .replace(/(\d+(?:\.\d+)?)\s*k/gi,  function(_,n){ return '('+n+'*1000)'; })
    .replace(/(\d+(?:\.\d+)?)\s*M/g,   function(_,n){ return '('+n+'*1000000)'; })
    .replace(/(\d+(?:\.\d+)?)\s*B/g,   function(_,n){ return '('+n+'*1000000000)'; })
    .replace(/(\d+(?:\.\d+)?)\s*T/g,   function(_,n){ return '('+n+'*1000000000000)'; });
}

function appendSuffix(s) {
  if (!expr) return;
  if (/[kKMBT]$/.test(expr) || /Th$/.test(expr)) return;
  expr += s;
  tryLiveEval();
  render();
}

// ============================================================
// SAFE EVAL
// ============================================================
function safeEval(e) {
  var exp = e + ')'.repeat(Math.max(0, parenCount));
  exp = exp.replace(/(\d)(Math\.)/g, '$1*$2');
  return Function('"use strict"; return (' + exp + ')')();
}

// ============================================================
// FORMAT
// ============================================================
function fmtNum(n) {
  if (wholeMode) return parseFloat(n.toFixed(1)).toLocaleString('en-US', {minimumFractionDigits:1, maximumFractionDigits:1});
  if (Math.abs(n) >= 1e15) return n.toExponential(4);
  if (!Number.isInteger(n) && Math.abs(n) < 1e10) return parseFloat(n.toPrecision(10)).toLocaleString('en-US');
  return n.toLocaleString('en-US', {maximumFractionDigits:10});
}

function showScaled(n) {
  if (!isFinite(n) || n === 0) { scaledEl.textContent = ''; return; }
  var a = Math.abs(n);
  var label = '';
  if      (a >= 1e12) label = (n/1e12).toPrecision(6).replace(/\.?0+$/,'') + ' T';
  else if (a >= 1e9)  label = (n/1e9).toPrecision(6).replace(/\.?0+$/,'')  + ' B';
  else if (a >= 1e6)  label = (n/1e6).toPrecision(6).replace(/\.?0+$/,'')  + ' M';
  else if (a >= 1e3)  label = (n/1e3).toPrecision(6).replace(/\.?0+$/,'')  + ' k';
  scaledEl.textContent = label;
}

function prettify(e) {
  return e.replace(/Math\.sqrt\(/g,'sqrt(').replace(/Math\.cbrt\(/g,'cbrt(')
    .replace(/Math\.log10\(/g,'log(').replace(/Math\.log\(/g,'ln(')
    .replace(/Math\.exp\(/g,'exp(').replace(/Math\.sin\(/g,'sin(')
    .replace(/Math\.cos\(/g,'cos(').replace(/Math\.tan\(/g,'tan(')
    .replace(/Math\.PI/g,'pi').replace(/Math\.abs\(/g,'abs(')
    .replace(/\*\*/g,'^').replace(/\*/g,'x').replace(/\//g,'/');
}

// ============================================================
// CALC ACTIONS
// ============================================================
function reset() {
  expr = ''; lastResult = null; hasResult = false; parenCount = 0;
  resultEl.textContent = '0'; resultEl.className = 'result-line';
  exprEl.textContent = ''; scaledEl.textContent = '';
}

function render() {
  resultEl.textContent = expr || '0';
  resultEl.className = 'result-line';
  exprEl.textContent = '';
  scaledEl.textContent = '';
}

function tryLiveEval() {
  try {
    var stripped = expr.replace(/[kKMBT]$/, '').replace(/Th$/, '');
    if (expr && !/[\+\-\*\/\(]$/.test(stripped)) {
      var r = safeEval(expandSuffixes(expr));
      if (isFinite(r)) {
        exprEl.textContent = prettify(expr);
        resultEl.textContent = fmtNum(r);
        resultEl.className = 'result-line';
        showScaled(r); return;
      }
    }
  } catch(e) {}
  exprEl.textContent = '';
  resultEl.textContent = expr || '0';
  resultEl.className = 'result-line';
  scaledEl.textContent = '';
}

function compute() {
  if (!expr) return;
  try {
    var r = safeEval(expandSuffixes(expr));
    if (!isFinite(r)) throw 0;
    var pe = prettify(expr);
    exprEl.textContent = pe + ' =';
    calcHistory.unshift({expr: pe, result: r});
    if (calcHistory.length > 50) calcHistory.pop();
    renderHistory();
    lastResult = r; expr = String(r); parenCount = 0; hasResult = true;
    resultEl.textContent = fmtNum(r);
    resultEl.className = 'result-line computed';
    showScaled(r);
  } catch(e) {
    exprEl.textContent = prettify(expr);
    resultEl.textContent = 'Error';
    resultEl.className = 'result-line error';
    scaledEl.textContent = '';
    expr = ''; parenCount = 0;
  }
}

function action(type, val) {
  if (type === 'ac') { reset(); return; }
  if (type === 'backspace') {
    if (hasResult) { reset(); return; }
    if (/Th$/.test(expr)) expr = expr.slice(0,-2);
    else if (expr.length) {
      var last = expr.slice(-1);
      if (last === '(') parenCount--;
      if (last === ')') parenCount++;
      expr = expr.slice(0,-1);
    }
    tryLiveEval(); render(); return;
  }
  if (type === 'num') {
    if (hasResult) { expr = ''; hasResult = false; }
    expr += val;
  }
  if (type === 'dot') {
    if (hasResult) { expr = '0'; hasResult = false; }
    var parts = expr.split(/[\+\-\*\/\(\)]/);
    if (!parts[parts.length-1].includes('.')) expr += '.';
  }
  if (type === 'op') {
    if (hasResult) hasResult = false;
    if (expr && /[\+\-\*\/]$/.test(expr)) expr = expr.slice(0,-1);
    expr += val;
  }
  if (type === 'sign') {
    if (!expr) return;
    expr = '(-(' + expr + '))';
    hasResult = false;
  }
  if (type === 'pct') {
    if (expr) { try { expr = String(safeEval(expandSuffixes(expr)) / 100); } catch(e){} }
  }
  if (type === 'paren') {
    if (hasResult) { expr = String(lastResult); hasResult = false; }
    if (val === '(') { parenCount++; expr += '('; }
    else if (val === ')' && parenCount > 0) { parenCount--; expr += ')'; }
  }
  if (type === 'fn') {
    if (hasResult) { expr = val + lastResult + ')'; hasResult = false; compute(); return; }
    parenCount++; expr += val;
  }
  if (type === 'pow') { if (expr) expr += val; }
  if (type === 'const') {
    if (hasResult) { expr = val; hasResult = false; } else expr += val;
  }
  if (type === 'eq') { compute(); return; }
  tryLiveEval(); render();
}

// ============================================================
// HISTORY
// ============================================================
function toggleHistory() {
  var panel = document.getElementById('history-panel');
  var open = panel.classList.toggle('open');
  document.getElementById('hist-label').textContent = (open ? '\u25be' : '\u25b8') + ' HISTORY';
}
function renderHistory() {
  var panel = document.getElementById('history-panel');
  var countEl = document.getElementById('hist-count');
  if (!calcHistory.length) {
    countEl.style.display = 'none';
    panel.innerHTML = '<div class="hist-empty">NO HISTORY YET</div>'; return;
  }
  countEl.style.display = 'inline';
  countEl.textContent = calcHistory.length;
  panel.innerHTML = calcHistory.map(function(h,i){
    return '<div class="hist-item" onclick="loadHistory('+i+')">'
      +'<span class="hist-expr">'+h.expr+'</span>'
      +'<span class="hist-result">'+fmtNum(h.result)+'</span></div>';
  }).join('') + '<button class="hist-clear" onclick="clearHistory()">x CLEAR HISTORY</button>';
}
function loadHistory(i) {
  var h = calcHistory[i];
  expr = String(h.result); lastResult = h.result; hasResult = true; parenCount = 0;
  exprEl.textContent = h.expr + ' =';
  resultEl.textContent = fmtNum(h.result);
  resultEl.className = 'result-line computed';
  showScaled(h.result);
  document.getElementById('history-panel').classList.remove('open');
  document.getElementById('hist-label').textContent = '\u25b8 HISTORY';
}
function clearHistory() { calcHistory = []; renderHistory(); }

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener('keydown', function(e) {
  if (document.getElementById('tab-ai').style.display === 'block') return;
  if (document.activeElement === document.getElementById('ai-input')) return;

  var k = e.key, code = e.code || '';
  if ((k >= '0' && k <= '9') || (code.startsWith('Numpad') && k >= '0' && k <= '9')) {
    e.preventDefault(); action('num', k);
  } else if (k === '.' || code === 'NumpadDecimal') { e.preventDefault(); action('dot'); }
  else if (k === '+' || code === 'NumpadAdd')      { e.preventDefault(); action('op','+'); }
  else if (k === '-' || code === 'NumpadSubtract') { e.preventDefault(); action('op','-'); }
  else if (k === '*' || code === 'NumpadMultiply') { e.preventDefault(); action('op','*'); }
  else if (k === '/' || code === 'NumpadDivide')   { e.preventDefault(); action('op','/'); }
  else if (k === 'Enter' || code === 'NumpadEnter' || k === '=') { e.preventDefault(); action('eq'); }
  else if (k === 'Backspace') { e.preventDefault(); action('backspace'); }
  else if (k === 'Escape' || k === 'Delete') action('ac');
  else if (k === '(') action('paren','(');
  else if (k === ')') action('paren',')');
  else if (k === '%') action('pct');
});

// ============================================================
// AI MATH (local, no API)
// ============================================================
var WORD_NUMS = {
  zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,
  ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,
  sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,
  thirty:30,forty:40,fifty:50,sixty:60,seventy:70,eighty:80,ninety:90,
  hundred:100,thousand:1000,million:1e6,billion:1e9,trillion:1e12
};

function wordsToNumber(str) {
  var tokens = str.toLowerCase().trim().split(/\s+/);
  var result = 0, current = 0;
  for (var i = 0; i < tokens.length; i++) {
    var n = WORD_NUMS[tokens[i]];
    if (n === undefined) return null;
    if (n === 100) current *= 100;
    else if (n >= 1000) { current = current || 1; result += current * n; current = 0; }
    else current += n;
  }
  return result + current;
}

function expandSuffixesAI(e) {
  return e
    .replace(/(\d+(?:\.\d+)?)\s*Th/gi, function(_,n){ return '('+n+'*1000)'; })
    .replace(/(\d+(?:\.\d+)?)\s*k/gi,  function(_,n){ return '('+n+'*1000)'; })
    .replace(/(\d+(?:\.\d+)?)\s*M/g,   function(_,n){ return '('+n+'*1000000)'; })
    .replace(/(\d+(?:\.\d+)?)\s*B/g,   function(_,n){ return '('+n+'*1000000000)'; })
    .replace(/(\d+(?:\.\d+)?)\s*T/g,   function(_,n){ return '('+n+'*1000000000000)'; })
    .replace(/\^/g,'**');
}

function parseAndCompute(raw) {
  var s = raw.trim().replace(/^(what\s+is|calculate|compute|solve|find|evaluate)\s*/i,'');

  // pct of
  var pctOf = s.match(/(\d+(?:\.\d+)?)\s*%\s*of\s*(.+)/i);
  if (pctOf) {
    var base = parseAndCompute(pctOf[2]);
    if (base !== null) return {val: (parseFloat(pctOf[1])/100)*base.val, expr: pctOf[1]+'% of '+pctOf[2]};
  }

  // direct math
  var expanded = expandSuffixesAI(s);
  try {
    var r = Function('"use strict"; return (' + expanded + ')')();
    if (isFinite(r)) return {val: r, expr: s};
  } catch(e) {}

  // word-op
  var opMatch = s.match(/^(.+?)\s*(divided\s+by|multiplied\s+by|plus|minus|times|over|\+|-|\*|x|\/|mod)\s*(.+)$/i);
  if (opMatch) {
    var opMap = {'divided by':'/','over':'/','multiplied by':'*','times':'*','x':'*','plus':'+','minus':'-','mod':'%'};
    var left = opMatch[1].trim(), op = opMatch[2].trim().toLowerCase(), right = opMatch[3].trim();
    op = opMap[op] || op;
    var lNum = wordsToNumber(left); if (lNum === null) { var lt = parseAndCompute(left); if(lt) lNum=lt.val; }
    var rNum = wordsToNumber(right); if (rNum === null) { var rt = parseAndCompute(right); if(rt) rNum=rt.val; }
    if (lNum !== null && rNum !== null) {
      var res = Function('"use strict"; return ('+lNum+op+rNum+')')();
      if (isFinite(res)) return {val:res, expr:lNum+' '+op+' '+rNum};
    }
  }

  // pure word number
  var wn = wordsToNumber(s);
  if (wn !== null) return {val:wn, expr:s};

  return null;
}

function solveWordProblem(s) {
  var lower = s.toLowerCase();

  // Age ago \u2014 very flexible: grab first number, then "N years ago/back/before"
  var ageAgo = lower.match(/(\d+(?:\.\d+)?)[^\d]+(\d+(?:\.\d+)?)\s*years?\s*(?:ago|back|before|earlier)/);
  if (ageAgo) {
    var now = parseFloat(ageAgo[1]), ago = parseFloat(ageAgo[2]);
    return {val: now - ago, note: 'Age '+now+' - '+ago+' years ago'};
  }

  // Age future: "X is N, how old will she be in M years"
  var ageFuture = lower.match(/(\d+(?:\.\d+)?)[^\d]+(\d+(?:\.\d+)?)\s*years?\s*(?:from|later|after|hence)/);
  if (ageFuture) {
    var now2 = parseFloat(ageFuture[1]), add = parseFloat(ageFuture[2]);
    return {val: now2 + add, note: 'Age '+now2+' + '+add+' years'};
  }

  // Total / combined
  if (/total|together|combined|altogether|sum|all of them/.test(lower)) {
    var nums = Array.from(lower.matchAll(/(\d+(?:\.\d+)?)/g)).map(function(m){return parseFloat(m[1]);});
    if (nums.length >= 2) return {val: nums.reduce(function(a,b){return a+b;},0), note: nums.join(' + ')};
  }

  // Left / remaining after subtraction
  if (/left|remain|after|used|spent|ate|sold|gave|give|lost|taken/.test(lower)) {
    var nums2 = Array.from(lower.matchAll(/(\d+(?:\.\d+)?)/g)).map(function(m){return parseFloat(m[1]);});
    if (nums2.length >= 2) return {val: nums2[0]-nums2[1], note: nums2[0]+' - '+nums2[1]};
  }

  // Rate x time
  var rateM = lower.match(/(\d+(?:\.\d+)?)\s*(?:per|every|each|a)\s*(?:hour|day|week|month|year|minute|second)/);
  var timeM = lower.match(/(?:in|for|over|after)\s+(\d+(?:\.\d+)?)\s*(?:hours?|days?|weeks?|months?|years?|minutes?|seconds?)/);
  if (rateM && timeM) {
    var rate = parseFloat(rateM[1]), time = parseFloat(timeM[1]);
    return {val: rate*time, note: rate+' x '+time};
  }

  // Split among
  var splitM = lower.match(/(?:split|divide|share|distributed?)\s*(\d+(?:\.\d+)?).*?(?:among|between|with|into|by|to)\s*(\d+)/);
  if (splitM) return {val: parseFloat(splitM[1])/parseFloat(splitM[2]), note: splitM[1]+' / '+splitM[2]};

  // Unit conversion
  var unitIn = lower.match(/how many\s+(\w+)\s+in\s+(\d+(?:\.\d+)?)\s*(\w+)/);
  var unitMap = {'minutes-hours':60,'seconds-minutes':60,'seconds-hours':3600,'hours-days':24,'days-weeks':7,'months-years':12,'cm-meters':100,'mm-cm':10};
  if (unitIn) {
    var key = unitIn[1]+'-'+unitIn[3];
    if (unitMap[key]) return {val: parseFloat(unitIn[2])*unitMap[key], note: unitIn[2]+' '+unitIn[3]+' x '+unitMap[key]};
  }

  return null;
}

var CHAT_REPLIES = {
  'hello':        'Hey! Type any math or question.',
  'hi':           'Hi! What do you want to calculate?',
  'hey':          'Hey! Give me a calculation.',
  'thanks':       'No problem! Try another one.',
  'thank you':    'Anytime!',
  'wow':          'I know right! Try something harder.',
  'amazing':      'Thanks! Give me another one.',
  'cool':         'Glad you think so!',
  'what can you do': 'I solve math: 79M/20k, sqrt(144), 2^10, word problems like "if X is 14 now how old was she 2 years ago", percentages, and more!',
  'help':         'Type any math expression or word problem. I handle k/M/B/T suffixes, word numbers, powers, roots and more.'
};

function buildReply(val, note) {
  var out = (note ? note + '\n' : '') + '= ' + fmtNum(val);
  var a = Math.abs(val);
  if      (a >= 1e12) out += '\n~ ' + (val/1e12).toPrecision(5).replace(/\.?0+$/,'') + ' T';
  else if (a >= 1e9)  out += '\n~ ' + (val/1e9).toPrecision(5).replace(/\.?0+$/,'')  + ' B';
  else if (a >= 1e6)  out += '\n~ ' + (val/1e6).toPrecision(5).replace(/\.?0+$/,'')  + ' M';
  else if (a >= 1e3)  out += '\n~ ' + (val/1e3).toPrecision(5).replace(/\.?0+$/,'')  + ' k';
  return out;
}

function addMsg(role, text, isErr) {
  var empty = document.getElementById('empty-state');
  if (empty) empty.remove();
  var wrap = document.createElement('div'); wrap.className = 'msg ' + role;
  var label = document.createElement('div'); label.className = 'msg-label';
  label.textContent = role === 'user' ? 'YOU' : 'CALC';
  var bubble = document.createElement('div');
  bubble.className = 'msg-bubble' + (isErr ? ' err' : '');
  bubble.textContent = text;
  wrap.appendChild(label); wrap.appendChild(bubble);
  var ca = document.getElementById('chat-area');
  ca.appendChild(wrap); ca.scrollTop = 99999;
}

function sendAI() {
  var input = document.getElementById('ai-input');
  var btn   = document.getElementById('ai-send-btn');
  var raw   = input.value.trim();
  if (!raw) return;
  input.value = ''; btn.disabled = true;
  addMsg('user', raw);

  setTimeout(function() {
    var lower = raw.toLowerCase().trim().replace(/[!?.]/g,'');

    // Chat?
    if (CHAT_REPLIES[lower]) { addMsg('ai', CHAT_REPLIES[lower]); btn.disabled=false; return; }

    // Direct math
    var r = parseAndCompute(raw);
    if (r !== null) { addMsg('ai', buildReply(r.val, null)); btn.disabled=false; return; }

    // Word problem
    var wp = solveWordProblem(raw);
    if (wp !== null) { addMsg('ai', buildReply(wp.val, wp.note)); btn.disabled=false; return; }

    addMsg('ai', "Couldn't figure that out. Try: 79M/20k, sqrt(144), or \"if X is 14 now, how old was she 2 years ago\"", true);
    btn.disabled = false;
  }, 100);
}
